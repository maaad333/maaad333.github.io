<script>
	var time;
	var timer;
	var $gamefacile = $(".gamefacile");
	var $gamemoyen = $(".gamemoyen");
	var $gamedifficile = $(".gamedifficile");
	let card1 = "", card2 = "", card3 = "";
	let chemin1 = "", chemin2 = "", chemin3 = "";
	let score = 0;
	let selection = 0;

	function start() {
		var selectedValue = document.getElementById("select").value;
		if (selectedValue == "Facile") {
			$gamefacile.show();
			$gamemoyen.hide();
			$gamedifficile.hide();
			time = document.getElementById("time");
			timer = setInterval(function () {
				let seconds = (parseFloat(time.innerHTML) + 0.1).toFixed(1);
				time.innerHTML = seconds;
			}, 100);
		} else if (selectedValue == "Moyen") {
			$gamemoyen.show();
			$gamefacile.hide();
			$gamedifficile.hide();
			time = document.getElementById("time"); timer = setInterval(function () {
				let seconds = (parseFloat(time.innerHTML) + 0.1).toFixed(1);
				time.innerHTML = seconds;
			}, 100);
		} else {
			$gamedifficile.show();
			$gamemoyen.hide();
			$gamefacile.hide();
			time = document.getElementById("time");
			timer = setInterval(function () {
				let seconds = (parseFloat(time.innerHTML) + 0.1).toFixed(1);
				time.innerHTML = seconds;
			}, 100);
		}
	}

	function restart() {
		location.reload()
	}

	$(".cache").on({
		"click": function () {
			if (selection == 0) {
				card1 = $(this).data("img");
				chemin1 = $(this).attr("src", card1);
				selection += 1;
			} else if (selection == 1) {
				card2 = $(this).data("img");
				chemin2 = $(this).attr("src", card2);
				selection += 1;
			} else {
				card3 = $(this).data("img");
				chemin3 = $(this).attr("src", card3);
				selection = 3;
			}

			if (selection == 2) {
				if (card1 != card2) {
					setTimeout(function () {
						$(chemin1).attr("src", "images/background.png");
						$(chemin2).attr("src", "images/background.png");
					}, 1000);
					selection = 0;
				} else {
					$(chemin1).off("click");
					$(chemin2).off("click");
				}
			}

			if (selection == 3) {
				if (card1 == card2 && card1 == card3 && card2 == card3) {
					$(chemin1).off("click");
					$(chemin2).off("click");
					$(chemin3).off("click");
					selection = 0;
					score += 1;
					document.querySelector('.score').textContent = score;
				} else {
					setTimeout(function () {
						$(chemin3).attr("src", "images/background.png");
					}, 1000);
					selection = 3;
				}
			}

			var selectedValue = document.getElementById("select").value;
			if (selectedValue == "Facile") {
				if (score == 3) {
					document.body.style.backgroundColor = "#DAF7A6";
					setTimeout(function () {
						if (confirm("BRAVO 🎉 VOUS AVEZ GAGNÉ! Voulez-vous recommencer?")) {
							location.reload();
						}
					}, 1000);
				}
			} else if (selectedValue == "Moyen") {
				if (score == 4) {
					document.body.style.backgroundColor = "#DAF7A6";
					setTimeout(function () {
						if (confirm("BRAVO 🎉 VOUS AVEZ GAGNÉ! Voulez-vous recommencer?")) {
							location.reload();
						}
					}, 1000);
				}
			} else {
				if (score == 8) {
					document.body.style.backgroundColor = "#DAF7A6";
					setTimeout(function () {
						if (confirm("BRAVO 🎉 VOUS AVEZ GAGNÉ! Voulez-vous recommencer?")) {
							location.reload();
						}
					}, 1000);
				}
			}
		}
	});	

</script>
